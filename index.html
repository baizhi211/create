<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>如果你的 OC 来到现实，TA 会和你说什么？</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html,body{margin:0;padding:0}
body{
  --pink:#F6A9C0; --mint:#A8DBC8; --cream:#FDF3E7; --lilac:#C7B8E8;
  --ink:#4A3A44; --sub:#8B7A84;
  --card-bg:rgba(255,255,255,.95); --card-line:rgba(246,169,192,.32);
  --bubble:#FFFFFF; --shadow:0 10px 28px rgba(211,141,166,.14);
  --font-hand:"Kaiti SC","STKaiti","KaiTi","楷体","Yuanti SC","YouYuan","圆体",serif;
  --font-base:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  margin:0; min-height:100vh; min-height:100dvh; color:var(--ink);
  font-family:var(--font-base); font-size:16px; line-height:1.6;
  background:
    radial-gradient(120% 80% at 82% -10%, #FFF0F6 0%, rgba(255,240,246,0) 62%),
    radial-gradient(90% 70% at 0% 108%, #E9F7F0 0%, rgba(233,247,240,0) 58%),
    var(--cream);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:background .45s ease,color .45s ease;
}
body.hidden-end{
  --ink:#F6EDF7; --sub:#B9A6C2;
  --card-bg:rgba(38,27,52,.93); --card-line:rgba(255,255,255,.14);
  --bubble:#231830; --shadow:0 14px 34px rgba(0,0,0,.45);
  background:
    radial-gradient(100% 70% at 82% -10%, #43284F 0%, rgba(67,40,79,0) 60%),
    radial-gradient(80% 60% at 0% 108%, #2A1B3D 0%, rgba(42,27,61,0) 58%),
    #15101E;
}

.petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.petals i{position:absolute;top:-10vh;display:block;width:11px;height:11px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#FFD9E6,#F6A9C0);opacity:.72;will-change:transform;animation:fall linear infinite}
.petals i:nth-child(2n){animation-name:fallB;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#FFE6EF,#F2B7CB)}
.petals i:nth-child(1){left:3%;animation-duration:12s;animation-delay:-1s;width:10px;height:10px}
.petals i:nth-child(2){left:11%;animation-duration:16s;animation-delay:-7s}
.petals i:nth-child(3){left:19%;animation-duration:10s;animation-delay:-3s;width:9px;height:9px}
.petals i:nth-child(4){left:27%;animation-duration:14s;animation-delay:-10s;width:13px;height:13px}
.petals i:nth-child(5){left:34%;animation-duration:18s;animation-delay:-5s}
.petals i:nth-child(6){left:41%;animation-duration:11s;animation-delay:-9s;width:8px;height:8px}
.petals i:nth-child(7){left:49%;animation-duration:15s;animation-delay:-2s;width:12px;height:12px}
.petals i:nth-child(8){left:57%;animation-duration:13s;animation-delay:-12s;width:9px;height:9px}
.petals i:nth-child(9){left:64%;animation-duration:17s;animation-delay:-6s;width:10px;height:10px}
.petals i:nth-child(10){left:72%;animation-duration:12s;animation-delay:-4s;width:14px;height:14px;opacity:.55}
.petals i:nth-child(11){left:79%;animation-duration:19s;animation-delay:-14s;width:8px;height:8px}
.petals i:nth-child(12){left:86%;animation-duration:14s;animation-delay:-8s;width:11px;height:11px}
.petals i:nth-child(13){left:92%;animation-duration:10s;animation-delay:-11s;width:7px;height:7px}
.petals i:nth-child(14){left:96%;animation-duration:16s;animation-delay:-3s;width:10px;height:10px}

.app{position:relative;z-index:1;width:100%;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 26px)}

.screen{display:none;flex:1;flex-direction:column;animation:screenIn .35s ease both}
.screen.active{display:flex}
#screenStart{justify-content:center;align-items:center;text-align:center}
#screenQuiz,#screenResult{justify-content:flex-start}

.start-mark{font-size:32px;line-height:1;color:var(--pink);margin-bottom:16px;animation:bob 4.5s ease-in-out infinite}
.start-title{margin:0 0 16px;font-family:var(--font-hand);font-weight:700;font-size:clamp(25px,7.4vw,36px);line-height:1.42;letter-spacing:.01em;color:#C2668C;background:linear-gradient(120deg,#E8759B 0%,#B78BDB 52%,#6FB79B 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-wrap:balance}
.start-sub{margin:0 0 38px;font-size:14px;color:var(--sub);letter-spacing:.03em}
.start-foot{margin:26px 0 0;font-size:12px;color:var(--sub);opacity:.8;letter-spacing:.05em}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:0 22px;border:none;border-radius:999px;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.03em;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#F58FB0,#C79BE8 70%,#B78BDB);color:#fff;box-shadow:0 12px 26px rgba(214,123,163,.34)}
.btn-ghost{background:transparent;border:1.5px solid var(--card-line);color:var(--sub)}
#btnStart{width:min(86%,320px)}

.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.quiz-count{font-size:13px;color:var(--sub);letter-spacing:.05em}
.quiz-count b{color:#D97A9B;font-size:15px;font-weight:800}
body.hidden-end .quiz-count b{color:#F0A7C4}
.back{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--card-line);background:var(--card-bg);color:var(--sub);font-family:inherit;font-size:13px;cursor:pointer;touch-action:manipulation;transition:transform .15s ease,opacity .2s ease}
.back:active:not(:disabled){transform:scale(.97)}
.back:disabled{opacity:.38}
.progress{height:8px;border-radius:999px;background:rgba(74,58,68,.08);overflow:hidden;margin-bottom:26px}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#F6A9C0,#C7B8E8);transition:width .35s ease}
.hidden-end .progress{background:rgba(255,255,255,.1)}
.q-text{margin:0 0 20px;font-size:clamp(19px,5.2vw,22px);line-height:1.55;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.options{display:flex;flex-direction:column;gap:11px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;min-height:58px;padding:14px 15px;border:1.5px solid var(--card-line);border-radius:16px;background:var(--card-bg);color:var(--ink);box-shadow:0 6px 16px rgba(211,141,166,.08);font-family:inherit;font-size:15px;line-height:1.5;text-align:left;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;animation:rise .45s cubic-bezier(.22,.9,.34,1) both;animation-delay:var(--d,0s)}
.opt .mark{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#FFF0F5;border:1px solid rgba(246,169,192,.55);color:#D97A9B;font-size:13px;font-weight:800;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
.opt .opt-text{display:block;word-break:break-word}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,rgba(255,233,240,.96),rgba(246,233,255,.96));border-color:var(--pink);box-shadow:0 10px 22px rgba(211,141,166,.2);transform:translateY(-1px) scale(1.008)}
.opt[aria-pressed="true"] .mark{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.05)}
.hidden-end .opt{box-shadow:0 6px 18px rgba(0,0,0,.3)}
.hidden-end .opt .mark{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);color:#F0A7C4}
.hidden-end .opt[aria-pressed="true"]{background:linear-gradient(135deg,rgba(246,169,192,.24),rgba(199,184,232,.24))}
.quiz-tip{margin:18px 0 0;font-size:12px;color:var(--sub);text-align:center;letter-spacing:.05em}

.res-kicker{margin:6px 0 6px;font-size:12.5px;color:var(--sub);text-align:center;letter-spacing:.18em}
.res-name{margin:2px 0 14px;font-family:var(--font-hand);font-weight:700;font-size:clamp(38px,12vw,52px);line-height:1.22;text-align:center;letter-spacing:.03em;word-break:break-word;background:linear-gradient(120deg,#E8759B 0%,#B78BDB 55%,#79BFA4 100%);-webkit-background-clip:text;background-clip:text;color:#C2668C;-webkit-text-fill-color:transparent}
.hidden-end .res-name{background:linear-gradient(120deg,#FFC3DA 0%,#D3B8F5 55%,#A9E6CB 100%);-webkit-background-clip:text;background-clip:text;color:#FFC3DA;-webkit-text-fill-color:transparent}
.res-tag{display:table;margin:0 auto 22px;padding:6px 14px;border-radius:999px;border:1px solid rgba(246,169,192,.4);background:rgba(246,169,192,.13);font-size:13px;color:#A06682;letter-spacing:.02em}
.hidden-end .res-tag{color:#E6C9DD;background:rgba(246,169,192,.14);border-color:rgba(246,169,192,.3)}
.ribbon{display:table;margin:10px auto 8px;padding:5px 14px;border-radius:999px;background:linear-gradient(135deg,#F6A9C0,#C7B8E8);color:#fff;font-size:12px;font-weight:700;letter-spacing:.14em;box-shadow:0 6px 16px rgba(246,169,192,.35)}
.bubble{position:relative;margin:0 0 22px;padding:18px 20px 20px;border-radius:18px;border:1.5px solid var(--card-line);background:var(--bubble);box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;left:26px;bottom:-8px;width:14px;height:14px;background:var(--bubble);border-right:1.5px solid var(--card-line);border-bottom:1.5px solid var(--card-line);transform:rotate(45deg);border-bottom-right-radius:3px}
.bubble-line{margin:0 0 9px;font-family:var(--font-hand);font-size:16px;line-height:1.8;color:var(--ink);letter-spacing:.01em}
.bubble-line:first-child{font-size:clamp(17px,4.6vw,19px)}
.bubble-line:last-child{margin-bottom:0}
.dossier{margin:0 0 20px;padding:18px 18px 16px;border-radius:20px;border:1px solid var(--card-line);background:var(--card-bg);box-shadow:var(--shadow)}
.dossier-title{margin:0 0 14px;font-size:11.5px;color:var(--sub);letter-spacing:.2em}
.attr{margin:0 0 12px}
.attr:last-of-type{margin-bottom:0}
.attr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:12.5px;color:var(--sub);letter-spacing:.03em}
.attr-num{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:rgba(74,58,68,.07);overflow:hidden}
.hidden-end .bar{background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--bar,#F6A9C0);transition:width 1s cubic-bezier(.22,.9,.3,1) .12s}
.mix{margin:14px 0 0;font-size:12px;color:var(--sub);letter-spacing:.02em}
.anime-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--card-line)}
.anime-row:first-of-type{padding-top:0}
.anime-row:last-child{border-bottom:none;padding-bottom:0}
.avatar{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-hand);font-size:19px;font-weight:700;letter-spacing:.02em;box-shadow:0 6px 14px rgba(211,141,166,.22)}
.anime-main{flex:1;min-width:0}
.anime-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.anime-name{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.4}
.anime-pct{flex:0 0 auto;font-size:12px;font-weight:700;color:#D97A9B;font-variant-numeric:tabular-nums}
.hidden-end .anime-pct{color:#F0A7C4}
.anime-from{margin:2px 0 7px;font-size:11.5px;color:var(--sub)}
.bar.slim{height:6px}
.anime-note{margin:7px 0 0;font-size:12px;line-height:1.65;color:var(--sub)}
.love-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.love-pct{flex:0 0 auto;font-family:var(--font-hand);font-size:42px;line-height:1;font-weight:700;letter-spacing:-.01em;background:linear-gradient(120deg,#E8759B,#B78BDB);-webkit-background-clip:text;background-clip:text;color:#C2668C;-webkit-text-fill-color:transparent}
.hidden-end .love-pct{background:linear-gradient(120deg,#FFC3DA,#D3B8F5);-webkit-background-clip:text;background-clip:text;color:#FFC3DA;-webkit-text-fill-color:transparent}
.love-pct em{font-style:normal;font-size:17px}
.love-note{flex:1;margin:0 0 3px;font-size:12px;line-height:1.65;color:var(--sub);text-align:right}
.love-item{display:grid;grid-template-columns:46px 1fr 40px;align-items:center;gap:9px;margin:0 0 9px;font-size:12px;color:var(--sub);letter-spacing:.02em}
.love-item:last-child{margin-bottom:0}
.love-item b{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.analysis{margin:4px 2px 22px;font-size:15px;line-height:1.95;color:var(--ink)}
.badges-label{margin:0 0 9px;font-size:11.5px;color:var(--sub);letter-spacing:.18em}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.badge{padding:5px 11px;border-radius:999px;border:1px solid var(--card-line);background:linear-gradient(135deg,rgba(246,169,192,.16),rgba(199,184,232,.22));color:var(--ink);font-size:12px;letter-spacing:.02em}
.meme{margin:0 0 26px;font-size:12.5px;line-height:1.9;color:var(--sub);text-align:center;letter-spacing:.02em}
.actions{display:grid;gap:12px}
.fallback{margin-top:14px}
.fallback[hidden]{display:none}
.fallback textarea{display:block;width:100%;min-height:112px;padding:12px;border-radius:14px;border:1px solid var(--card-line);background:var(--card-bg);color:var(--ink);font-family:inherit;font-size:13px;line-height:1.7;resize:vertical}
.fallback p{margin:8px 0 0;font-size:11.5px;color:var(--sub);text-align:center}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);z-index:90;max-width:82vw;padding:10px 18px;border-radius:999px;background:rgba(52,40,50,.93);color:#fff;font-size:13px;line-height:1.5;text-align:center;opacity:0;transform:translate(-50%,14px);pointer-events:none;transition:opacity .25s ease,transform .25s ease}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0deg)}50%{transform:translate3d(26px,52vh,0) rotate(220deg)}100%{transform:translate3d(-10px,112vh,0) rotate(520deg)}}
@keyframes fallB{0%{transform:translate3d(0,-12vh,0) rotate(0deg)}50%{transform:translate3d(-30px,50vh,0) rotate(-200deg)}100%{transform:translate3d(12px,112vh,0) rotate(-540deg)}}

@media (hover:hover){.btn-primary:hover{box-shadow:0 14px 30px rgba(214,123,163,.42)}.opt:hover{transform:translateY(-1px)}.back:hover:not(:disabled){background:rgba(255,255,255,.96)}}
@media (prefers-reduced-motion:reduce){.petals i,.start-mark{animation:none}.screen,.opt,.reveal{animation-duration:.01s !important}.bar i{transition-duration:.01s !important}}
</style>
</head>

    <div class="progress" role="progressbar" aria-label="答题进度"><i id="progressFill"></i></div>

    <p class="quiz-tip">凭第一直觉，选最像你的那个</p>
  </section>

  <section class="screen" id="screenResult">
    <div id="resultRoot"></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

          "text": "想让 TA 得到一切，又怕 TA 被夺走",
          "t": 4
        },
        {
          "text": "边写边笑，写着写着把自己逗乐了",
          "t": 5
        },
        {
          "text": "写不写随缘，灵感来了才动笔",
          "t": 6
        },
        {
          "text": "先列大纲，把逻辑漏洞补完再动笔",
          "t": 7
        }
      ]
    },
    {
      "q": "你的 OC 的故事，主角光环强吗？",
      "options": [
        {
          "text": "不强，甚至有点惨，但很美",
          "t": 2
        },
        {
          "text": "有，但更像是被世界温柔以待",
          "t": 3
        },
        {
          "text": "强到离谱，毕竟是天选之子",
          "t": 0
        },
        {
          "text": "嘴上说没有，实际一路开挂",
          "t": 1
        }
      ]
    },
    {
      "q": "如果 OC 来到现实，TA 对你说的第一句话是？",
      "options": [
        {
          "text": "「你终于来了，我等了很久。」",
          "t": 6
        },
        {
          "text": "「走！带你去吃好吃的！」",
          "t": 7
        },
        {
          "text": "「哦，你来了啊……随便坐。」",
          "t": 4
        },
        {
          "text": "「你问的问题，我三秒前就推演完了。」",
          "t": 5
        }
      ]
    }
  ]
}
</script>
<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('quizData').textContent);
  var TYPES = DATA.types;
  var HIDDEN = DATA.hidden;
  var QUESTIONS = DATA.questions;
  var PRIORITY = ['刀子制造机', '治愈系白月光', '中二病晚期', '傲娇毒舌系', '病娇黑化系', '沙雕团宠系', '佛系摆烂仙', '高冷天才系'];
  var BAR_COLORS = ['#F6A9C0', '#A8DBC8', '#C7B8E8', '#FFC58F', '#9EC9EC'];
  var AVATAR_COLORS = [['#F6A9C0', '#C7B8E8'], ['#A8DBC8', '#9EC9EC']];
  var TOTAL = QUESTIONS.length;
  var HIDE_MIN = 5;

  var answers = [];
  for (var i = 0; i < TOTAL; i++) { answers.push(null); }
  var qi = 0;
  var lock = false;
  var lastShare = '';

  var elQIndex = document.getElementById('qIndex');
  var elQTotal = document.getElementById('qTotal');
  var elBar = document.getElementById('progressFill');
  var elQText = document.getElementById('qText');
  var elOptions = document.getElementById('options');
  var elBack = document.getElementById('btnBack');
  var elResult = document.getElementById('resultRoot');
  var elToast = document.getElementById('toast');
  var toastTimer = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function toast(msg) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove('show'); }, 2200);
  }

  function showScreen(id) {
    var list = document.querySelectorAll('.screen');
    for (var i = 0; i < list.length; i++) {
      list[i].classList.toggle('active', list[i].id === id);
    }
    window.scrollTo(0, 0);
  }

  function renderQuestion() {
    elQIndex.textContent = String(qi + 1);
    elQTotal.textContent = String(TOTAL);
    var filled = 0;
    for (var i = 0; i < TOTAL; i++) { if (answers[i] !== null) { filled++; } }
    elBar.style.width = (filled / TOTAL * 100).toFixed(2) + '%';
    elBack.disabled = qi === 0;

    var q = QUESTIONS[qi];
    elQText.textContent = q.q;
    elOptions.innerHTML = '';
    for (var k = 0; k < q.options.length; k++) {
      var opt = q.options[k];
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt';
      btn.dataset.idx = String(k);
      btn.setAttribute('aria-pressed', answers[qi] === k ? 'true' : 'false');
      btn.style.setProperty('--d', (k * 0.045).toFixed(3) + 's');

      var mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = 'ABCD'.charAt(k);

      var txt = document.createElement('span');
      txt.className = 'opt-text';
      txt.textContent = opt.text;

      btn.appendChild(mark);
      btn.appendChild(txt);
      btn.addEventListener('click', onPick);
      elOptions.appendChild(btn);
    }
  }

  function onPick(ev) {
    if (lock) { return; }
    var btn = ev.currentTarget;
    var idx = parseInt(btn.dataset.idx, 10);
    if (isNaN(idx)) { return; }
    lock = true;

    var all = elOptions.querySelectorAll('.opt');
    for (var i = 0; i < all.length; i++) {
      all[i].setAttribute('aria-pressed', i === idx ? 'true' : 'false');
    }
    try { if (navigator.vibrate) { navigator.vibrate(8); } } catch (e) {}

    setTimeout(function () {
      answers[qi] = idx;
      lock = false;
      if (qi < TOTAL - 1) {
        qi++;
        renderQuestion();
      } else {
        finish();
      }
    }, 280);
  }

  function goBack() {
    if (lock || qi === 0) { return; }
    qi--;
    renderQuestion();
  }

  function compute() {
    var scores = [0, 0, 0, 0, 0, 0, 0, 0];
    var proj = 0;
    var ach = [];
    for (var i = 0; i < TOTAL; i++) {
      var a = answers[i];
      if (a === null) { continue; }
      var o = QUESTIONS[i].options[a];
      scores[o.t]++;
      if (o.m) { proj++; }
      if (o.ach && ach.indexOf(o.ach) < 0) { ach.push(o.ach); }
    }
    if (proj >= HIDE_MIN) {
      return { hidden: true, proj: proj, ach: ach.slice(0, 5), scores: scores };
    }
    var order = [0, 1, 2, 3, 4, 5, 6, 7];
    order.sort(function (x, y) {
      if (scores[y] !== scores[x]) { return scores[y] - scores[x]; }
      return PRIORITY.indexOf(TYPES[x].name) - PRIORITY.indexOf(TYPES[y].name);
    });
    var main = order[0];
    var sub = order[1];
    var denom = scores[main] + scores[sub];
    var p = denom > 0 ? Math.round(scores[sub] / denom * 100) : 0;
    return { hidden: false, main: main, sub: sub, p: p, ach: ach.slice(0, 5), scores: scores };
  }

  function badgeHTML(ach, delay) {
    if (!ach.length) { return ''; }
    var out = '<p class="badges-label reveal" style="--d:' + delay + 's">成就徽章</p><div class="badges reveal" style="--d:' + delay + 's">';
    for (var i = 0; i < ach.length; i++) {
      out += '<span class="badge">' + esc(ach[i]) + '</span>';
    }
    return out + '</div>';
  }

  function memeHTML(memes, delay) {
    var parts = [];
    for (var i = 0; i < memes.length; i++) { parts.push('「' + esc(memes[i]) + '」'); }
    return '<p class="meme reveal" style="--d:' + delay + 's">' + parts.join('<br>') + '</p>';
  }

  function actionsHTML(delay) {
    return '<div class="actions reveal" style="--d:' + delay + 's">' +
      '<button class="btn btn-primary" id="btnCopy" type="button">复制分享文案</button>' +
      '<button class="btn btn-ghost" id="btnRetry" type="button">再测一次</button>' +
      '</div>' +
      '<div class="fallback" id="copyFallback" hidden><textarea id="shareBox" readonly></textarea><p>复制失败，长按上方文字即可手动复制</p></div>';
  }

  function dossierHTML(t, r) {
    var out = '<div class="dossier reveal" style="--d:.24s"><p class="dossier-title">OC 档案</p>';
    for (var i = 0; i < t.attrs.length; i++) {
      var name = t.attrs[i][0];
      var val = t.attrs[i][1];
      out += '<div class="attr"><div class="attr-top"><span>' + esc(name) + '</span><span class="attr-num">' + val + '</span></div>' +
        '<div class="bar"><i data-w="' + val + '" style="--bar:' + BAR_COLORS[i % BAR_COLORS.length] + '"></i></div></div>';
    }
    if (r.p > 0) {
      out += '<p class="mix">副类型 mixing：' + esc(TYPES[r.sub].name) + ' ' + r.p + '%</p>';
    }
    return out + '</div>';
  }

  function bubbleHTML(lines, delay) {
    var out = '<div class="bubble reveal" style="--d:' + delay + 's">';
    for (var i = 0; i < lines.length; i++) {
      out += '<p class="bubble-line">「' + esc(lines[i]) + '」</p>';
    }
    return out + '</div>';
  }

  function animeHTML(list, delay) {
    var out = '<div class="dossier reveal" style="--d:' + delay + 's"><p class="dossier-title">相似动漫人物</p>';
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      var g = AVATAR_COLORS[i % AVATAR_COLORS.length];
      out += '<div class="anime-row">' +
        '<div class="avatar" style="background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')">' + esc(a.letter || a.name.charAt(0)) + '</div>' +
        '<div class="anime-main">' +
          '<div class="anime-top"><span class="anime-name">' + esc(a.name) + '</span><span class="anime-pct">' + a.match + '%</span></div>' +
          '<p class="anime-from">' + esc(a.from) + '</p>' +
          '<div class="bar slim"><i data-w="' + a.match + '" style="--bar:' + g[1] + '"></i></div>' +
          '<p class="anime-note">' + esc(a.note) + '</p>' +
        '</div>' +
        '</div>';
    }
    return out + '</div>';
  }

  function loveHTML(love, delay) {
    var out = '<div class="dossier reveal" style="--d:' + delay + 's"><p class="dossier-title">TA 对你的感情占比</p>' +
      '<div class="love-head"><span class="love-pct">' + love.pct + '<em>%</em></span><p class="love-note">' + esc(love.note) + '</p></div>' +
      '<div class="love-items">';
    for (var i = 0; i < love.items.length; i++) {
      out += '<div class="love-item"><span>' + esc(love.items[i][0]) + '</span>' +
        '<div class="bar slim"><i data-w="' + love.items[i][1] + '" style="--bar:' + BAR_COLORS[i % BAR_COLORS.length] + '"></i></div>' +
        '<b>' + love.items[i][1] + '%</b></div>';
    }
    return out + '</div></div>';
  }

  function buildResult(r) {
    var html = '';
    if (r.hidden) {
      html += '<p class="res-kicker reveal" style="--d:0s">你的 OC 人设类型是</p>';
      html += '<div class="ribbon reveal" style="--d:.04s">' + esc(HIDDEN.mark) + '</div>';
      html += '<h2 class="res-name reveal" style="--d:.08s">' + esc(HIDDEN.name) + '</h2>';
      html += bubbleHTML(HIDDEN.lines, 0.12);
      html += animeHTML(HIDDEN.anime, 0.18);
      html += loveHTML(HIDDEN.love, 0.24);
      html += '<p class="analysis reveal" style="--d:.3s">' + esc(HIDDEN.analysis) + '</p>';
      html += badgeHTML(r.ach, 0.36);
      html += memeHTML(HIDDEN.memes, 0.42);
      lastShare = HIDDEN.share;
    } else {
      var t = TYPES[r.main];
      html += '<p class="res-kicker reveal" style="--d:0s">你的 OC 人设类型是</p>';
      html += '<h2 class="res-name reveal" style="--d:.05s">' + esc(t.name) + '</h2>';
      html += '<p class="res-tag reveal" style="--d:.1s">' + esc(t.tag) + '</p>';
      html += bubbleHTML(t.lines, 0.14);
      html += dossierHTML(t, r);
      html += animeHTML(t.anime, 0.28);
      html += loveHTML(t.love, 0.34);
      html += '<p class="analysis reveal" style="--d:.4s">' + esc(t.analysis) + '</p>';
      html += badgeHTML(r.ach, 0.46);
      html += memeHTML(t.memes, 0.52);
      lastShare = t.share;
    }
    html += actionsHTML(0.58);
    return html;
  }

  function finish() {
    var r = compute();
    elResult.innerHTML = buildResult(r);
    document.body.classList.toggle('hidden-end', !!r.hidden);
    showScreen('screenResult');
    void elResult.offsetHeight;
    setTimeout(function () {
      var bars = elResult.querySelectorAll('.bar i');
      for (var i = 0; i < bars.length; i++) {
        bars[i].style.width = bars[i].getAttribute('data-w') + '%';
      }
    }, 40);
  }

  function copyShare() {
    if (!lastShare) { return; }
    var text = lastShare;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          hideFallback();
          toast('已复制，去小红书发帖吧');
        }, function () {
          legacyCopy(text);
        });
        return;
      }
    } catch (e) {}
    legacyCopy(text);
  }

  function hideFallback() {
    var box = document.getElementById('copyFallback');
    if (box) { box.hidden = true; }
  }

  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    if (ok) {
      hideFallback();
      toast('已复制，去小红书发帖吧');
      return;
    }
    showFallback(text);
    toast('复制失败，请长按文本手动复制');
  }

  function showFallback(text) {
    var box = document.getElementById('copyFallback');
    var area = document.getElementById('shareBox');
    if (!box || !area) { return; }
    area.value = text;
    box.hidden = false;
    try {
      area.focus();
      area.select();
    } catch (e) {}
  }

  function restart() {
    for (var i = 0; i < TOTAL; i++) { answers[i] = null; }
    qi = 0;
    lock = false;
    lastShare = '';
    document.body.classList.remove('hidden-end');
    elResult.innerHTML = '';
    renderQuestion();
    showScreen('screenQuiz');
  }

  elBack.addEventListener('click', goBack);
  elResult.addEventListener('click', function (e) {
    var target = e.target;
    if (target && target.id === 'btnCopy') { copyShare(); }
    else if (target && target.id === 'btnRetry') { restart(); }
  });
  document.getElementById('btnStart').addEventListener('click', function () {
    showScreen('screenQuiz');
    renderQuestion();
  });

  renderQuestion();
  showScreen('screenStart');
})();
</script>
</body>
</html>
